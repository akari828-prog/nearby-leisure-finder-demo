name: Build free Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "free=RSS実検索（端末内分類） / demo=サンプル表示"
        required: true
        default: free
        type: choice
        options:
          - free
          - demo
  push:
    paths:
      - nearby_leisure_finder_flutter.zip
      - SOURCE_SHA256.txt
      - .github/workflows/build-apk.yml

permissions:
  contents: write

concurrency:
  group: nearby-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build Android APK
    if: ${{ github.repository_owner == 'akari828-prog' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'free' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare build mode and signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          NEARBY_DEBUG_KEYSTORE: ${{ runner.temp }}/nearby-debug.keystore
        run: |
          python3 - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          mode = os.environ["BUILD_MODE"]
          if mode not in {"demo", "free"}:
              raise SystemExit("ビルドモードが不正です。")
          key_base64 = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "")
          key_path = Path(os.environ["NEARBY_DEBUG_KEYSTORE"])
          key_path.parent.mkdir(parents=True, exist_ok=True)
          if key_base64.strip():
              try:
                  key_bytes = base64.b64decode("".join(key_base64.split()), validate=True)
              except ValueError:
                  raise SystemExit("署名鍵のBase64形式が不正です。") from None
              if not key_bytes:
                  raise SystemExit("署名鍵が空です。")
              key_path.write_bytes(key_bytes)
          else:
              subprocess.run([
                  "keytool", "-genkeypair", "-keystore", str(key_path),
                  "-storetype", "JKS", "-storepass", "android",
                  "-keypass", "android", "-alias", "androiddebugkey",
                  "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                  "-dname", "CN=Android Debug,O=Android,C=JP", "-noprompt",
              ], check=True)
          key_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"NEARBY_DEBUG_KEYSTORE={key_path}\n")
          print("ビルドモードと署名設定を確認しました。")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: false

      - name: Verify and extract complete project
        run: |
          sha256sum --check SOURCE_SHA256.txt
          mkdir app
          unzip -q nearby_leisure_finder_flutter.zip -d app
          chmod +x app/android/gradlew

      - name: Install Dart dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze --no-pub

      - name: Test on-device event classification
        working-directory: app
        run: flutter test --no-pub

      - name: Build demo APK
        if: env.BUILD_MODE == 'demo'
        working-directory: app
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=MOCK_MODE=true

      - name: Build free RSS search APK
        if: env.BUILD_MODE == 'free'
        working-directory: app
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=MOCK_MODE=false

      - name: Verify APK and record public signing certificate information
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          sdk_directory = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          if not sdk_directory:
              raise SystemExit("Android SDKの場所を確認できません。")
          signers = list((Path(sdk_directory) / "build-tools").glob("*/apksigner"))
          if not signers:
              raise SystemExit("APKの署名検証ツールが見つかりません。")
          signer = max(signers, key=lambda path: tuple(int(part) for part in re.findall(r"\d+", path.parent.name)))
          result = subprocess.run([
              str(signer), "verify", "--verbose", "--print-certs",
              "app/build/app/outputs/flutter-apk/app-release.apk",
          ], capture_output=True, text=True)
          print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, end="")
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          Path("app/SIGNING_INFO.txt").write_text(result.stdout, encoding="utf-8")
          PY

      - name: Publish APK for phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="app/nearby-leisure-${BUILD_MODE}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk_path"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          mode = os.environ["BUILD_MODE"]
          apk = Path(f"app/nearby-leisure-{mode}.apk")
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path("app/APK_SHA256.txt").write_text(f"{checksum}  {apk.name}\n", encoding="utf-8")
          description = (
              "現在地、RSS、端末内のキーワード分類でイベント候補を検索します。Firebase、Gemini API、APIキーは使いません。"
              if mode == "free" else
              "表示・距離・広告・ブラウザ遷移のデモ版です。表示するサンプルは実在イベントではありません。"
          )
          notes = (
              "Android向けの端末確認用APKです。\n\n"
              + description
              + "\n\nGoogle公式テスト広告IDを使用します。\n\n"
              + "APKをAndroidのブラウザーでダウンロードして開くとインストールできます。"
              + "Androidが求めた場合は、APKを開いたアプリのインストール権限を許可してください。\n\n"
              + "SIGNING_INFO.txtには公開署名証明書の情報、APK_SHA256.txtにはファイル確認用ハッシュがあります。\n"
          )
          Path("app/RELEASE_NOTES_JA.md").write_text(notes, encoding="utf-8")
          PY
          release_tag="android-${BUILD_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" "$apk_path" app/SIGNING_INFO.txt app/APK_SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android ${BUILD_MODE} build ${GITHUB_RUN_NUMBER}" --notes-file app/RELEASE_NOTES_JA.md --prerelease

      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "$NEARBY_DEBUG_KEYSTORE" ]; then
            rm -f "$NEARBY_DEBUG_KEYSTORE"
          fi
